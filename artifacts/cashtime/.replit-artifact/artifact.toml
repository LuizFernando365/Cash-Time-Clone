kind = "web"
previewPath = "/cashtime"
title = "CashTime"
version = "1.0.0"
id = "artifacts/cashtime"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/cashtime" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/cashtime run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cashtime", "run", "build" ]
publicDir = "artifacts/cashtime/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/cashtime"
